name: ✨ Feature Request
description: Suggest a new feature or improvement for FlowJS
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make FlowJS better? We'd love to hear it!

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of FlowJS does this relate to?
      options:
        - Routing (file-system router, layouts, params)
        - SSR / Rendering
        - Build Pipeline
        - CLI (flowjs / create-flowjs-app)
        - Data Loading (loaders, actions)
        - Middleware
        - Client-Side Navigation
        - Developer Experience (errors, logs, HMR)
        - Documentation
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is there a workaround today?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the API or behavior you'd like to see.
      placeholder: |
        I'd like a `useServerData()` hook that...

        ```tsx
        export default function Page() {
          const data = useServerData<MyType>();
          return <div>{data.title}</div>;
        }
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've considered?
    validations:
      required: false

  - type: dropdown
    id: breaking
    attributes:
      label: Would this be a breaking change?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Links, screenshots, related issues, or prior art from other frameworks.
    validations:
      required: false
