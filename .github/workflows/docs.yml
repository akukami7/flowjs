name: Docs CI

on:
  push:
    branches: ["main"]
    # Можно запускать деплой только если изменения были в папке с документацией
    # paths:
    #   - 'docs/**'

# Даем права для деплоя на GitHub Pages (если используете)
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Documentation
        # Замените на вашу реальную команду для сборки документации
        run: pnpm run docs:build 

      # Следующие шаги нужны, если вы публикуете документацию на GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Укажите папку, куда собирается ваша документация (например, ./docs/.next, ./docs/dist или ./docs/build)
          path: './docs/dist'

  deploy-docs:
    # Деплоим только при пуше в main, но не в Pull Request
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4